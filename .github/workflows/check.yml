name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting
        # ktlint, through Spotless. CI only checks the formatting: a local build applies it (build.gradle.kts).
        run: bash ./gradlew spotlessCheck --continue --no-daemon --console=plain

      - name: Lint
        run: bash ./gradlew detektAll --continue --no-daemon --console=plain

      - name: Run tests
        # The iOS targets compile to klibs here, but running their tests takes macOS: only the JVM's run.
        run: bash ./gradlew allTests --no-daemon --console=plain
